
apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-app
  namespace: staging

spec:
  replicas: 3

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
        - name: flask-app
          image: 442255790021.dkr.ecr.us-east-1.amazonaws.com/flask-compose-lab:8263aa8d17bb29f0d54ade72312e3d15d145ade3
          ports:
            - containerPort: 5000
