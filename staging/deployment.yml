
apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-app
  namespace: staging

spec:
  replicas: 3

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
        - name: flask-app
          image: 442255790021.dkr.ecr.us-east-1.amazonaws.com/flask-compose-lab:d2d188b6b0b575b12824a0b0a93a8e2e865c061a
          ports:
            - containerPort: 5000
