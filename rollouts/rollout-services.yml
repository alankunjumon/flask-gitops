
apiVersion: v1
kind: Service
metadata:
  name: flask-rollout-active
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: flask-app-rollout
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: flask-rollout-preview
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: flask-app-rollout
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
